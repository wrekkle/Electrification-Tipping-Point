   <g id="text_1">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 15.127425)">F7 non-monotone event trajectory - machine status: missing_data</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 24.4008)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 37.46655)">family E7, regime experiments_main22 (22 kW layer), seed 20261031</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 48.607425)">rows in traj_E7.csv: 0</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 59.767425)">status in meta_E7.json: missing_data</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 70.94655)">reason (meta_E7.json records it in Chinese; English rendering):</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 82.88505)">  no non-monotone event in which the service rate decreases as k</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 93.366675)">  increases was observed in the held-out block; no trajectory is</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 104.501925)">  fabricated (original text stays in the machine file).</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 113.6808)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 126.821925)">Requirement: one held-out site-day whose served-service rate falls when k grows.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 138.006675)">Result: no such event was observed in the held-out block, so no trajectory is drawn.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 147.1608)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans Mono'" transform="translate(15.54048 160.301925)">No synthetic substitute is used here; the negative result is the evidence.</text>
   </g>
  </g>
  <g id="text_2">
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(1.44 184.012156)">F7 | E7 is a pre-registered search for a non-monotone k response; the machine output records missing_data with</text>
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(1.44 192.144813)">zero trajectory rows. Drawing a trajectory from another family or from synthetic data would fabricate a result,</text>
   <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(1.44 200.204813)">so this panel reports the status instead.</text>
  </g>
